# Repulabs — Nginx reverse proxy config
# Path: /etc/nginx/sites-available/repulabs
# Enable: sudo ln -s /etc/nginx/sites-available/repulabs /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# Assumes:
#   - certbot installed: sudo apt install certbot python3-certbot-nginx
#   - certs issued: sudo certbot --nginx -d repulabs.com -d www.repulabs.com
#   - Cloudflare in front (Real IP header restored from cf-connecting-ip)

# ---- Upstream ----
upstream repulabs_app {
  server 127.0.0.1:3000 fail_timeout=5s max_fails=3;
  keepalive 32;
}

# ---- Rate limit zones ----
# 10MB = ~160k unique IPs tracked. Tune `rate` to your traffic.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ---- Real-IP from Cloudflare ----
# If you put Cloudflare in front, restore the client IP:
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# (full list: https://www.cloudflare.com/ips-v4)
# real_ip_header CF-Connecting-IP;

# ---- HTTP → HTTPS redirect ----
server {
  listen 80;
  listen [::]:80;
  server_name repulabs.com www.repulabs.com app.repulabs.com admin.repulabs.com r.repulabs.com;

  # Let's Encrypt challenge files
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS — primary app domain ----
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name repulabs.com www.repulabs.com app.repulabs.com admin.repulabs.com r.repulabs.com;

  ssl_certificate     /etc/letsencrypt/live/repulabs.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/repulabs.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  # ---- Global limits ----
  limit_conn conn_zone 50;
  client_max_body_size 5M;
  client_body_timeout 30s;

  # ---- Compression ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
  # brotli if module installed:
  # brotli on;
  # brotli_types ...;

  # ---- Proxy defaults ----
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Connection "";
  proxy_read_timeout 60s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;

  # ---- Hot-path rate limits ----
  # Login/signup brute-force shield (app also limits, this is belt-and-braces).
  location ~ ^/api/auth/(signin|callback|signup) {
    limit_req zone=login_zone burst=5 nodelay;
    proxy_pass http://repulabs_app;
  }

  # Scan redirect — app already rate-limits per (ip,slug), this caps per-IP total.
  location ~ ^/r/ {
    limit_req zone=scan_zone burst=20 nodelay;
    proxy_pass http://repulabs_app;
  }

  # ---- Admin hardware batch — STREAMING ZIP (the 502-on-500 fix) ----
  # These endpoints stream a ZIP that builds incrementally (README + manifest
  # first, then one QR/NFC unit at a time). The default proxy_read_timeout 60s +
  # response buffering would buffer the whole archive and cut a 500-unit run
  # short → 502 → the streamed codes (only place the plaintext activation codes
  # exist) lost → bricked devices. So for these paths:
  #   - proxy_buffering off  → bytes pass straight through as the app emits them
  #   - 300s read/send       → matches the routes' maxDuration=300
  # `location =` (exact) and the download regex both rank ABOVE the generic
  # `location /api/` prefix, so they win for these URLs.
  #
  # POST /api/admin/hardware/batch  — generate + stream a new batch.
  location = /api/admin/hardware/batch {
    proxy_pass http://repulabs_app;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # No gzip on an already-compressed ZIP, and gzip would force buffering.
    gzip off;
  }

  # POST /api/admin/hardware/batch/<id>/download — one-time recovery re-download.
  location ~ ^/api/admin/hardware/batch/[^/]+/download$ {
    proxy_pass http://repulabs_app;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    gzip off;
  }

  # General API
  location /api/ {
    limit_req zone=api_zone burst=120 nodelay;
    proxy_pass http://repulabs_app;
  }

  # Static Next.js assets — cache aggressively
  location /_next/static/ {
    proxy_pass http://repulabs_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Health check — no rate limit, no access log
  location = /api/health {
    proxy_pass http://repulabs_app;
    access_log off;
  }

  # Default
  location / {
    proxy_pass http://repulabs_app;
  }

  # ---- Logging ----
  access_log /var/log/nginx/repulabs.access.log;
  error_log  /var/log/nginx/repulabs.error.log warn;
}
