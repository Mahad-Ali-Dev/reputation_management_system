  </g>
  <circle cx="42" cy="226" r="18" fill="url(#chatGrad)"/>
  <path d="M33.8 230.2l-2.6 8.2 7.5-3.1c1.2.3 2.4.5 3.7.5 8.1 0 14.5-5.8 14.5-13S50.5 210 42.4 210 28 215.8 28 222.9c0 2.7.9 5.2 2.6 7.3Z" fill="#FFFFFF" opacity="0.97"/>
  <circle cx="37.2" cy="223" r="2.2" fill="#6B54FF"/><circle cx="42.5" cy="223" r="2.2" fill="#6B54FF"/><circle cx="47.8" cy="223" r="2.2" fill="#6B54FF"/>
