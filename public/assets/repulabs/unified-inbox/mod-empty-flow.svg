    <path d="M13.5 6.2h6.8c1.3 0 2.2.9 2.2 2.1v4.9c0 1.2-.9 2.1-2.2 2.1h-6.8c-1.3 0-2.2-.9-2.2-2.1V8.3c0-1.2.9-2.1 2.2-2.1Z" stroke="#FF6B38" stroke-width="1.4"/>
