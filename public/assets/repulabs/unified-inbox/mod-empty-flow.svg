<svg xmlns="http://www.w3.org/2000/svg" width="3236" height="1092" viewBox="0 0 809 273" fill="none">
  <defs>
    <linearGradient id="purpleLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E62FF"/>
      <stop offset="1" stop-color="#B5A6FF"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="419" y1="86" x2="500" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8D77FF"/>
      <stop offset="1" stop-color="#A28BFF"/>
    </linearGradient>
    <linearGradient id="fbGrad" x1="20" y1="18" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#466CFF"/>
    </linearGradient>
    <linearGradient id="igGrad" x1="20" y1="105" x2="60" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD45A"/>
      <stop offset="0.45" stop-color="#F222B6"/>
      <stop offset="1" stop-color="#594BFF"/>
    </linearGradient>
    <linearGradient id="chatGrad" x1="22" y1="194" x2="60" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#765CFF"/>
      <stop offset="1" stop-color="#684BFF"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="606" y1="120" x2="645" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BDD8F"/>
      <stop offset="1" stop-color="#17BD62"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF5EE"/>
      <stop offset="1" stop-color="#FFE5D5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#181942" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#23305D" flood-opacity="0.11"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aiGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#9B86FF" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#6B56D9" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- subtle decorative dots around center -->
