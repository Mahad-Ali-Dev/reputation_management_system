<svg xmlns="http://www.w3.org/2000/svg" width="992" height="768" viewBox="0 0 496 384" fill="none">
  <defs>
    <linearGradient id="purpleStroke" x1="20" y1="0" x2="230" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A6BFF"/>
      <stop offset="1" stop-color="#8D63FF"/>
    </linearGradient>
    <linearGradient id="softPurple" x1="15" y1="10" x2="70" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF0FF"/>
      <stop offset="1" stop-color="#DED5FF"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="60" y1="320" x2="112" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4FCEF"/>
      <stop offset="1" stop-color="#D3F8E2"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>

  <!-- Connectors -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 56V94" stroke="url(#purpleStroke)" stroke-width="2" opacity=".78"/>
    <circle cx="92" cy="94" r="4" fill="#5C66FF"/>
    <path d="M122 146V181" stroke="url(#purpleStroke)" stroke-width="2" opacity=".78"/>
    <circle cx="122" cy="181" r="4" fill="#5C66FF"/>
    <path d="M143 240V273" stroke="#63C58E" stroke-width="2" opacity=".78"/>
    <circle cx="143" cy="273" r="4" fill="#62C98B"/>
    <path d="M143 291V313" stroke="url(#purpleStroke)" stroke-width="2" opacity=".55"/>
    <circle cx="143" cy="313" r="4" fill="#62C98B"/>
    <path d="M240 212H277" stroke="#8B63FF" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
    <path d="M342 212H392C403 212 406 218 406 229V247" stroke="#8B63FF" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
    <circle cx="406" cy="247" r="4" fill="#7A52F6"/>
  </g>

  <!-- Top card -->
  <g filter="url(#cardShadow)">
    <rect x="6" y="5" width="170" height="52" rx="8" fill="white" stroke="#E5E9F2"/>
  </g>
  <rect x="22" y="16" width="40" height="40" rx="10" fill="url(#softPurple)"/>
  <g stroke="#5264FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 32.5C34 27.5 38.3 24 43.5 24C48.7 24 53 27.4 53 32.5C53 37.6 48.7 41 43.5 41H38.6L33.6 45L34.8 39.4C33.6 37.6 34 35.3 34 32.5Z"/>
    <path d="M40 32.6H47" opacity=".65"/>
  </g>
  <text x="79" y="27" font-family="Inter, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#111827">New message</text>
  <text x="79" y="42" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="500" fill="#667085">From any channel</text>

  <!-- AI reply card -->
  <g filter="url(#cardShadow)">
    <rect x="31" y="94" width="193" height="52" rx="8" fill="white" stroke="#E5E9F2"/>
  </g>
  <circle cx="63" cy="120" r="22" fill="#F3F0FF"/>
  <g stroke="#6652FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58.5 110.5C60.1 116.5 63.4 119.6 69.5 121.2C63.4 122.8 60.1 125.9 58.5 132C56.9 125.9 53.6 122.8 47.5 121.2C53.6 119.6 56.9 116.5 58.5 110.5Z"/>
    <path d="M76 107.5C76.7 110.1 78.1 111.5 80.7 112.2C78.1 112.9 76.7 114.3 76 116.9C75.3 114.3 73.9 112.9 71.3 112.2C73.9 111.5 75.3 110.1 76 107.5Z" stroke-width="1.8"/>
    <path d="M75.5 127C76.1 129.2 77.3 130.4 79.5 131C77.3 131.6 76.1 132.8 75.5 135C74.9 132.8 73.7 131.6 71.5 131C73.7 130.4 74.9 129.2 75.5 127Z" stroke-width="1.8"/>
  </g>
  <text x="107" y="118" font-family="Inter, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#111827">AI reply</text>
  <text x="107" y="133" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="500" fill="#667085">Instant response</text>

  <!-- Route by intent card -->
  <g filter="url(#cardShadow)">
    <path d="M88 181H240C246.6 181 252 186.4 252 193V228C252 234.6 246.6 240 240 240H88L57 211L88 181Z" fill="white" stroke="#E5E9F2"/>
  </g>
  <rect x="78" y="196" width="43" height="43" rx="4" fill="#F1EFFF" transform="rotate(45 99.5 217.5)"/>
  <g stroke="#655CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M97 204V226"/>
    <circle cx="97" cy="204" r="3" fill="white"/>
    <circle cx="97" cy="226" r="3" fill="white"/>
    <path d="M97 215H111"/>
    <circle cx="111" cy="215" r="3" fill="white"/>
  </g>
  <text x="113" y="207" font-family="Inter, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#111827">Route by intent</text>
  <text x="113" y="222" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="500" fill="#667085">Understand &amp; route</text>

  <!-- Needs human pill -->
  <rect x="280" y="203.5" width="63" height="18" rx="9" fill="#FBF7FF" stroke="#8B63FF" stroke-opacity=".65"/>
  <text x="291" y="215" font-family="Inter, Arial, sans-serif" font-size="6.7" font-weight="700" fill="#7B4DF4">Needs human</text>

  <!-- Human handoff card -->
  <g filter="url(#cardShadow)">
    <rect x="296" y="247" width="170" height="57" rx="8" fill="white" stroke="#E5E9F2"/>
  </g>
  <rect x="310" y="260" width="39" height="39" rx="9" fill="url(#softPurple)"/>
  <g stroke="#7B52F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="329.5" cy="273" r="4.3"/>
    <path d="M319.5 290C320.7 283 324.4 279.7 329.5 279.7C334.6 279.7 338.3 283 339.5 290"/>
  </g>
  <text x="363" y="270" font-family="Inter, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#111827">Human handoff</text>
  <text x="363" y="285" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="500" fill="#667085">Notify your team</text>

  <!-- Auto-resolved pill -->
  <rect x="113" y="273" width="65" height="18" rx="9" fill="#E5FBEF" stroke="#62C98B" stroke-opacity=".65"/>
  <text x="119" y="284.5" font-family="Inter, Arial, sans-serif" font-size="6.8" font-weight="700" fill="#22A668">Auto-resolved</text>

  <!-- Conversation closed card -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="313" width="176" height="56" rx="8" fill="white" stroke="#E5E9F2"/>
  </g>
  <rect x="67" y="323" width="40" height="40" rx="10" fill="url(#greenSoft)"/>
  <g stroke="#16A05D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="87" cy="343" r="11.3"/>
    <path d="M81.2 342.8L85.2 346.8L93.6 337.9"/>
  </g>
  <text x="113" y="337" font-family="Inter, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#111827">Conversation closed</text>
  <text x="113" y="352" font-family="Inter, Arial, sans-serif" font-size="7.8" font-weight="500" fill="#667085">Solved</text>
</svg>
