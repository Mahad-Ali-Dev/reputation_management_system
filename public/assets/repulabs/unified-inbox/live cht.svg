<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="812" viewBox="0 0 330 203" fill="none">
  <defs>
    <linearGradient id="centralGrad" x1="119" y1="57" x2="205" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E8CFF"/>
      <stop offset="0.46" stop-color="#6A45F4"/>
      <stop offset="1" stop-color="#A66CFF"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(165 104) rotate(90) scale(78)">
      <stop offset="0" stop-color="#806BFF" stop-opacity="0.18"/>
      <stop offset="0.64" stop-color="#8F80FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BDB5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="18" y1="20" x2="78" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0EEFF"/>
      <stop offset="1" stop-color="#DED9FF"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="267" y1="139" x2="307" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D3FFF0"/>
      <stop offset="1" stop-color="#A8F3D0"/>
    </linearGradient>
    <filter id="softShadow" x="80" y="28" width="170" height="170" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6A45F4" flood-opacity="0.22"/>
    </filter>
    <filter id="badgeShadow" x="0" y="0" width="330" height="203" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7362F1" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- transparent background: no rect -->

  <circle cx="165" cy="103" r="77" fill="url(#haloGrad)"/>
  <circle cx="165" cy="103" r="61" fill="#8A7CFF" opacity="0.075"/>

  <!-- orbital dashed paths -->
  <path d="M18 142 C10 92 42 56 93 55 C156 54 213 87 266 131 C290 151 310 163 322 159" stroke="#BDB5FF" stroke-width="1.35" stroke-dasharray="4.2 3.4" stroke-linecap="round" opacity="0.72"/>
  <path d="M74 52 C154 45 259 17 294 43 C321 63 287 115 224 144 C164 172 70 168 25 145" stroke="#C6BEFF" stroke-width="1.2" stroke-dasharray="4.2 3.4" stroke-linecap="round" opacity="0.58"/>
  <path d="M47 42 C105 76 163 121 224 150 C257 166 282 172 311 168" stroke="#C3BBFF" stroke-width="1.1" stroke-dasharray="4.2 3.4" stroke-linecap="round" opacity="0.50"/>
  <path d="M214 39 C280 31 310 43 304 72 C298 110 235 136 171 144" stroke="#C7C0FF" stroke-width="1.1" stroke-dasharray="4.2 3.4" stroke-linecap="round" opacity="0.54"/>

  <!-- sparkles -->
  <g fill="#B6ADFF" opacity="0.82">
    <path d="M83.5 9.5 L86.4 16.1 L93 19 L86.4 21.9 L83.5 28.5 L80.6 21.9 L74 19 L80.6 16.1 Z" opacity="0.72"/>
    <path d="M45.5 93 L48.1 98.9 L54 101.5 L48.1 104.1 L45.5 110 L42.9 104.1 L37 101.5 L42.9 98.9 Z" opacity="0.72"/>
    <path d="M244.5 181 L247.1 186.9 L253 189.5 L247.1 192.1 L244.5 198 L241.9 192.1 L236 189.5 L241.9 186.9 Z" opacity="0.72"/>
    <path d="M232.5 105 L234.6 109.9 L239.5 112 L234.6 114.1 L232.5 119 L230.4 114.1 L225.5 112 L230.4 109.9 Z" opacity="0.64"/>
    <path d="M301 92 L303.1 96.9 L308 99 L303.1 101.1 L301 106 L298.9 101.1 L294 99 L298.9 96.9 Z" opacity="0.58"/>
    <path d="M93 0 L94.3 3.2 L97.5 4.5 L94.3 5.8 L93 9 L91.7 5.8 L88.5 4.5 L91.7 3.2 Z" opacity="0.55"/>
  </g>

  <!-- badges -->
  <g filter="url(#badgeShadow)">
    <circle cx="48" cy="44" r="24" fill="url(#badgeGrad)" opacity="0.98"/>
    <circle cx="294" cy="151" r="22" fill="url(#mintGrad)"/>
    <circle cx="282" cy="35" r="13" fill="#E7E3FF"/>
  </g>

  <!-- user icon -->
  <g stroke="#633EF2" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="34" r="6.1"/>
    <path d="M36.5 54.5 C37.2 47.6 41.7 44.3 48 44.3 C54.4 44.3 58.8 47.6 59.5 54.5"/>
  </g>

  <!-- small chat badge -->
  <g stroke="#51469A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274.4 30.1 H289.4 C290.6 30.1 291.6 31.1 291.6 32.3 V40.5 C291.6 41.7 290.6 42.7 289.4 42.7 H281.3 L276.7 46.1 V42.7 H274.4 C273.2 42.7 272.2 41.7 272.2 40.5 V32.3 C272.2 31.1 273.2 30.1 274.4 30.1 Z"/>
    <circle cx="280.4" cy="36.4" r="0.75" fill="#51469A" stroke="none"/>
    <circle cx="284" cy="36.4" r="0.75" fill="#51469A" stroke="none"/>
  </g>

  <!-- plane badge -->
  <path d="M280.4 151.6 L304.1 140.7 L294.1 164.3 L290.1 154.8 L280.4 151.6 Z M290.1 154.8 L304.1 140.7" stroke="#2D276E" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- central button and chat bubble -->
  <g filter="url(#softShadow)">
    <circle cx="165" cy="103" r="47.5" fill="url(#centralGrad)"/>
  </g>

  <path d="M143.2 82.9 H190.6 C203.4 82.9 213.7 93.2 213.7 106 C213.7 118.8 203.4 129.1 190.6 129.1 H160.2 L144 141.1 C142.2 142.4 139.8 141.1 139.8 138.9 V129.2 C128.5 127.6 119.8 117.8 119.8 106 C119.8 93.2 130.4 82.9 143.2 82.9 Z" fill="white"/>
  <g fill="#6B46F3">
    <circle cx="151.6" cy="105.8" r="4.6"/>
    <circle cx="165" cy="105.8" r="4.6"/>
    <circle cx="178.4" cy="105.8" r="4.6"/>
  </g>
</svg>
