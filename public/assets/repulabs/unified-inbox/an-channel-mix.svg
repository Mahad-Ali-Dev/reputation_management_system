<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 512 512" role="img" aria-label="Social media chat wheel icon" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="blueGrad" x1="78" y1="55" x2="308" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2aa6ff"/>
      <stop offset="0.48" stop-color="#087bff"/>
      <stop offset="1" stop-color="#005be8"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="339" y1="58" x2="490" y2="253" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff35bd"/>
      <stop offset="0.50" stop-color="#fb0aa7"/>
      <stop offset="1" stop-color="#e1008f"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="332" y1="258" x2="489" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6573"/>
      <stop offset="0.50" stop-color="#424b59"/>
      <stop offset="1" stop-color="#303846"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#1e3768"/>
      <stop offset="0.52" stop-color="#122956"/>
      <stop offset="1" stop-color="#071939"/>
    </radialGradient>
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f4f7"/>
    </linearGradient>
    <filter id="pieceShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#081631" flood-opacity="0.24"/>
    </filter>
    <filter id="centerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#06142f" flood-opacity="0.42"/>
    </filter>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a1530" flood-opacity="0.25"/>
    </filter>
    <clipPath id="outerClip"><circle cx="256" cy="256" r="238"/></clipPath>
  </defs>

  <!-- segmented glossy wheel: no background rectangle, transparent outside the icon -->
  <g filter="url(#pieceShadow)" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#outerClip)">
    <path d="M 256.00 256.00 L 214.67 490.38 A 238.00 238.00 0 1 1 321.60 27.22 Z" fill="url(#blueGrad)" stroke="#0965e9" stroke-width="4"/>
    <path d="M 256.00 256.00 L 321.60 27.22 A 238.00 238.00 0 0 1 494.00 256.00 Z" fill="url(#pinkGrad)" stroke="#db0d92" stroke-width="4"/>
    <path d="M 256.00 256.00 L 494.00 256.00 A 238.00 238.00 0 0 1 214.67 490.38 Z" fill="url(#grayGrad)" stroke="#303946" stroke-width="4"/>
    <!-- soft glossy rim highlights -->
    <circle cx="256" cy="256" r="233" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="7"/>
    <circle cx="256" cy="256" r="223" fill="none" stroke="#000000" stroke-opacity="0.07" stroke-width="8"/>
  </g>
  <g opacity="0.65" clip-path="url(#outerClip)">
    <path d="M76 93 C120 52 185 34 267 45" fill="none" stroke="#ffffff" stroke-opacity="0.23" stroke-width="10" stroke-linecap="round"/>
    <path d="M342 71 C393 75 446 124 470 200" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- social icons -->
  <g filter="url(#iconShadow)">
    <circle cx="131" cy="244" r="38" fill="url(#whiteGrad)"/>
    <path fill="#1269f2" d="M139.2 289.3v-41.7h14.0l2.1-16.3h-16.1v-10.4c0-4.7 1.3-7.9 8.1-7.9h8.6v-14.6c-1.5-.2-6.6-.6-12.5-.6-12.4 0-20.9 7.6-20.9 21.5v12.0h-14.0v16.3h14.0v41.7h16.7z"/>

    <g transform="translate(362 132)" fill="none" stroke="#fff" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-34" y="-34" width="68" height="68" rx="19"/>
      <circle cx="0" cy="0" r="17"/>
    </g>
    <circle cx="386" cy="108" r="6.7" fill="#fff"/>

    <path fill="url(#whiteGrad)" d="M384.5 344.5c-32.4 0-58.7 20.6-58.7 46.0 0 12.6 6.5 24.1 17.0 32.4l-6.2 24.0c-.9 3.5 2.9 6.3 5.9 4.4l25.9-16.0c5.1.8 10.5 1.3 16.1 1.3 32.4 0 58.7-20.6 58.7-46.0s-26.3-46.1-58.7-46.1z"/>
    <circle cx="366" cy="391" r="7" fill="#303946"/>
    <circle cx="386" cy="391" r="7" fill="#303946"/>
    <circle cx="406" cy="391" r="7" fill="#303946"/>
  </g>

  <!-- raised center hub -->
  <circle cx="256" cy="256" r="106" fill="url(#centerGrad)" filter="url(#centerShadow)"/>
  <circle cx="256" cy="256" r="101" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#06132f" stroke-opacity="0.36" stroke-width="4"/>
  <g filter="url(#iconShadow)">
    <circle cx="229" cy="256" r="8.2" fill="#fff"/>
    <circle cx="256" cy="256" r="8.2" fill="#fff"/>
    <circle cx="283" cy="256" r="8.2" fill="#fff"/>
  </g>
</svg>
