<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EEFF"/>
      <stop offset="100%" stop-color="#D6CCFF"/>
    </linearGradient>

    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE7FF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- transparent bg -->
  <rect width="1400" height="800" fill="transparent"/>

  <!-- bottom pedestal -->
  <ellipse cx="700" cy="520" rx="520" ry="140" fill="url(#base)" filter="url(#shadow)"/>

  <!-- middle ring shadow -->
  <ellipse cx="700" cy="480" rx="430" ry="110" fill="#E9E2FF" opacity="0.8"/>

  <!-- top pedestal -->
  <ellipse cx="700" cy="420" rx="360" ry="95" fill="url(#top)" filter="url(#shadow)"/>

  <!-- subtle highlight -->
  <ellipse cx="700" cy="400" rx="300" ry="70" fill="#FFFFFF" opacity="0.6"/>
</svg>
