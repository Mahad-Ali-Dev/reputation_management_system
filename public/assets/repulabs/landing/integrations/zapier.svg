<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g transform="translate(256,256)">
    <!-- 8 spokes radiating from center -->
    <!-- Vertical -->
    <rect x="-24" y="-200" width="48" height="400" rx="24" fill="#FF4F00"/>
    <!-- Horizontal -->
    <rect x="-200" y="-24" width="400" height="48" rx="24" fill="#FF4F00"/>
    <!-- 45deg -->
    <rect x="-24" y="-200" width="48" height="400" rx="24" fill="#FF4F00" transform="rotate(45)"/>
    <!-- 135deg -->
    <rect x="-24" y="-200" width="48" height="400" rx="24" fill="#FF4F00" transform="rotate(135)"/>
  </g>
  <!-- Center circle cutout overlay to create the asterisk look -->
  <circle cx="256" cy="256" r="96" fill="#FF4F00"/>
</svg>