<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="purple" x1="90" y1="60" x2="420" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#4F2DFF"/>
    </linearGradient>
    <linearGradient id="purpleDeep" x1="130" y1="100" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D4BFF"/>
      <stop offset="1" stop-color="#3F22D8"/>
    </linearGradient>
    <linearGradient id="teal" x1="90" y1="70" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BE3B2"/>
      <stop offset="1" stop-color="#00B982"/>
    </linearGradient>
    <linearGradient id="gold" x1="90" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD447"/>
      <stop offset="1" stop-color="#F3A300"/>
    </linearGradient>
    <linearGradient id="blue" x1="90" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52A0FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="pink" x1="90" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8DBD"/>
      <stop offset="1" stop-color="#E94586"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#332075" flood-opacity=".16"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#5D4FD1" flood-opacity=".18"/>
    </filter>
  </defs>

  <g fill="url(#gold)" filter="url(#softShadow)">
    <rect x="130" y="274" width="62" height="138" rx="18"/>
    <rect x="225" y="211" width="62" height="201" rx="18"/>
    <rect x="320" y="146" width="62" height="266" rx="18"/>
  </g>
</svg>
