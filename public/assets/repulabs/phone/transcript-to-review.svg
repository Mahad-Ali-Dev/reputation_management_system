  <g fill="#9B84FF" opacity="0.9">
    <path d="M168 308L179 338L209 349L179 360L168 390L157 360L127 349L157 338L168 308Z"/>
    <path d="M164 392L169 406L183 411L169 416L164 430L159 416L145 411L159 406L164 392Z"/>
