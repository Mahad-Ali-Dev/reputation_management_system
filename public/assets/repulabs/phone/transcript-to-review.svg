<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" fill="none">
  <defs>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8A8FF"/>
      <stop offset="100%" stop-color="#4E22FF"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A2BFF"/>
      <stop offset="100%" stop-color="#B9A6FF"/>
    </linearGradient>
    <linearGradient id="stripGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8CEFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C7B9FF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.72  0 1 0 0 0.66  0 0 1 0 1  0 0 0 0.35 0"/>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- soft card shadow/glow -->
  <rect x="220" y="230" width="820" height="580" rx="76" fill="#CFC4FF" opacity="0.18" filter="url(#softGlow)"/>

  <!-- main card -->
  <rect x="215" y="220" width="820" height="580" rx="76" fill="#F9F9FC" fill-opacity="0.92" stroke="#EDE9FF" stroke-width="8"/>
  <rect x="280" y="280" width="705" height="375" rx="40" fill="#EFEAFB" fill-opacity="0.55"/>
  <rect x="325" y="435" width="605" height="330" rx="38" fill="#FBFBFD" fill-opacity="0.52"/>

  <!-- top UI -->
  <rect x="360" y="320" width="195" height="34" rx="17" fill="#D9D3F0" fill-opacity="0.55"/>
  <rect x="360" y="320" width="142" height="34" rx="17" fill="url(#tabGrad)"/>
  <circle cx="659" cy="364" r="16" fill="#6E44FF" opacity="0.88"/>
  <rect x="725" y="318" width="235" height="38" rx="19" fill="#E7E2F5" fill-opacity="0.8"/>
  <circle cx="944" cy="351" r="18" fill="#C7B9FF" opacity="0.86"/>

  <!-- side block and content lines -->
  <rect x="280" y="365" width="45" height="270" rx="22.5" fill="#ECE7F8" fill-opacity="0.9"/>
  <rect x="360" y="470" width="463" height="30" rx="15" fill="#D9D0F5" fill-opacity="0.8"/>
  <rect x="360" y="548" width="450" height="28" rx="14" fill="#DCD5F6" fill-opacity="0.78"/>
  <rect x="360" y="598" width="360" height="24" rx="12" fill="#E2DCF8" fill-opacity="0.72"/>
  <rect x="290" y="700" width="95" height="34" rx="17" fill="#D1C7F0" fill-opacity="0.88"/>
  <rect x="922" y="690" width="62" height="34" rx="17" fill="#D5CCF1" fill-opacity="0.82"/>

  <!-- overlay strip -->
  <rect x="430" y="500" width="855" height="182" rx="44" fill="url(#stripGrad)" stroke="#C8B9FF" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="450" y="520" width="815" height="142" rx="38" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- play button -->
  <circle cx="476" cy="591" r="96" fill="url(#playGrad)"/>
  <path d="M455 547C455 538 465 532 473 537L531 574C539 579 539 591 531 596L473 633C465 638 455 632 455 623V547Z" fill="white"/>

  <!-- waveform -->
  <g fill="#7250FF">
    <circle cx="624" cy="596" r="8"/>
    <rect x="645" y="582" width="12" height="28" rx="6"/>
    <rect x="674" y="562" width="12" height="68" rx="6"/>
    <rect x="703" y="540" width="12" height="112" rx="6"/>
    <rect x="732" y="560" width="12" height="72" rx="6"/>
    <rect x="761" y="578" width="12" height="36" rx="6"/>
    <circle cx="791" cy="596" r="8"/>
    <rect x="813" y="570" width="12" height="52" rx="6"/>
    <rect x="842" y="548" width="12" height="96" rx="6"/>
    <rect x="871" y="565" width="12" height="62" rx="6"/>
    <circle cx="901" cy="596" r="8"/>
    <rect x="923" y="544" width="12" height="104" rx="6"/>
    <rect x="952" y="563" width="12" height="66" rx="6"/>
    <circle cx="980" cy="596" r="8"/>
    <rect x="1002" y="541" width="12" height="110" rx="6"/>
    <rect x="1031" y="560" width="12" height="72" rx="6"/>

    <circle cx="1106" cy="596" r="8"/>
    <rect x="1127" y="577" width="12" height="38" rx="6"/>
    <rect x="1156" y="549" width="12" height="94" rx="6"/>
    <rect x="1185" y="532" width="12" height="128" rx="6"/>
    <rect x="1214" y="557" width="12" height="78" rx="6"/>
    <rect x="1243" y="569" width="12" height="54" rx="6"/>
    <rect x="1272" y="579" width="12" height="34" rx="6"/>
  </g>

